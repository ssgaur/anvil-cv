[project]
name = "anvil-cv"
version = "0.0.1"
description = "Source-available image annotation platform with built-in SAM2 fine-tuning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "PolyForm-Noncommercial-1.0.0 OR LicenseRef-Anvil-Commercial" }
authors = [{ name = "Shailendra Singh" }]

[tool.uv.workspace]
members = ["apps/api", "apps/ml", "apps/worker", "packages/storage"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "node_modules", "checkpoints", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = [
  "E501",  # line length handled by formatter
  "B008",  # FastAPI Depends/File/Query pattern
  "N812",  # `import torch.nn.functional as F` is universal convention
  "E702",  # we use `;` in compact one-liners (notably e2e scripts)
]

[tool.ruff.lint.per-file-ignores]
"apps/api/anvil_api/routes/datasets.py" = ["E402"]  # lazy imports for optional deps
"apps/api/anvil_api/routes/models.py" = ["N814"]    # `Path as _P` to avoid shadowing
"scripts/*" = ["E402", "E701", "E702", "B007", "N806"]  # one-off e2e scripts

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["node_modules", ".venv", "checkpoints", "vendor"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
python_files = ["test_*.py"]

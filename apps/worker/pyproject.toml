[project]
name = "anvil-worker"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "arq>=0.26",
  "redis>=5.2",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "anvil-storage",
]

[tool.uv.sources]
anvil-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anvil_worker"]

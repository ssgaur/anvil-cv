[project]
name = "anvil-api"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pydantic[email]>=2.9",
  "email-validator>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[argon2]>=1.7",
  "python-multipart>=0.0.17",
  "httpx>=0.27",
  "arq>=0.26",
  "anvil-storage",
]

[tool.uv.sources]
anvil-storage = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anvil_api"]

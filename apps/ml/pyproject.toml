[project]
name = "anvil-ml"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "numpy>=1.26",
  "pillow>=10.4",
  "opencv-python-headless>=4.10",
  "torch>=2.4",
  "httpx>=0.27",
  "transformers>=5.7",
  "pycocotools>=2.0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anvil_ml"]

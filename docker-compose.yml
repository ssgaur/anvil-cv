services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anvil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anvil}
      POSTGRES_DB: ${POSTGRES_DB:-anvil}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anvil}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-anvil}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-anvilanvil}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages/storage:/app/packages/storage
    command: uvicorn anvil_api.main:app --host 0.0.0.0 --port 8000 --reload

  ml:
    build:
      context: .
      dockerfile: apps/ml/Dockerfile
    env_file: .env
    ports:
      - "8001:8001"
    volumes:
      - ./apps/ml:/app/apps/ml
      - ./checkpoints:/checkpoints
    command: uvicorn anvil_ml.main:app --host 0.0.0.0 --port 8001 --reload

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages/storage:/app/packages/storage
    command: arq anvil_worker.main.WorkerSettings

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: pnpm dev --host 0.0.0.0

volumes:
  postgres_data:
  minio_data:

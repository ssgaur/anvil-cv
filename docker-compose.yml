# One-command dev stack for Anvil.
#   make up         -> start everything (auto-downloads SAM2 weights on first run)
#   docker compose up
#
# Open http://localhost:5173 once "anvil-web" logs say "Local: ...".

services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anvil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anvil}
      POSTGRES_DB: ${POSTGRES_DB:-anvil}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anvil}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-anvil}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-anvilanvil}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # First-run only: create the storage bucket inside MinIO. Idempotent.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-anvil} ${MINIO_ROOT_PASSWORD:-anvilanvil}
        mc mb -p local/${STORAGE_BUCKET:-anvil} || true
        mc anonymous set download local/${STORAGE_BUCKET:-anvil} || true
        echo 'minio bucket ready'
    restart: "no"

  # First-run only: download SAM2 base+ weights (~700 MB) into a named volume,
  # so it survives container rebuilds. Skips if the file already exists.
  init-checkpoint:
    image: alpine:3.20
    volumes:
      - checkpoints:/checkpoints
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ -f /checkpoints/sam2.1_hiera_base_plus.pt ]; then
          echo 'sam2 checkpoint already present, skipping'
          exit 0
        fi
        echo 'installing curl...'
        apk add --no-cache curl
        echo 'downloading sam2.1_hiera_base_plus.pt (~700 MB)...'
        curl -L --fail -o /checkpoints/sam2.1_hiera_base_plus.pt \
          https://dl.fbaipublicfiles.com/segment_anything_2/092824/sam2.1_hiera_base_plus.pt
        echo 'checkpoint ready'
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anvil}:${POSTGRES_PASSWORD:-anvil}@postgres:5432/${POSTGRES_DB:-anvil}
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      ANVIL_ML_INTERNAL_TOKEN: ${ANVIL_ML_INTERNAL_TOKEN:-anvil-local-ml}
      PERSONAL_VIDEO_WORKER_URL: ${PERSONAL_VIDEO_WORKER_URL:-auto}
      ANVIL_PERSONAL_WORKER_TOKEN: ${ANVIL_PERSONAL_WORKER_TOKEN:-anvil-personal-worker}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      # The API and ML containers both need filesystem access for local-mode
      # images/embeddings. Override any host-specific .env STORAGE_ROOT.
      STORAGE_ROOT: /data
      MINIO_ENDPOINT: http://minio:9000
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports: ["8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - local_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 20
    command: uvicorn anvil_api.main:app --host 0.0.0.0 --port 8000

  ml:
    build:
      context: .
      dockerfile: apps/ml/Dockerfile
    env_file: .env
    environment:
      SAM2_CHECKPOINT: /checkpoints/sam2.1_hiera_base_plus.pt
      SAM2_MODEL_CFG: configs/sam2.1/sam2.1_hiera_b+.yaml
      ML_DEVICE: ${ML_DEVICE:-cpu}
      # SAM3 weights are read from the shared HF cache below. The model is
      # lazy-loaded, so a missing/unauthenticated cache degrades to "SAM2 only"
      # instead of breaking startup.
      HF_HOME: /hf-cache
      HF_TOKEN: ${HF_TOKEN:-}
      SAM3_MODEL_ID: ${SAM3_MODEL_ID:-facebook/sam3}
      # SAM2 (~2.1GB) + SAM3 (~3.5GB) both resident is ~5.6GB. Above this
      # budget the registry releases the least-recently-used model rather than
      # letting the kernel OOM-kill the container.
      ANVIL_MODEL_MEMORY_BUDGET_GB: ${ANVIL_MODEL_MEMORY_BUDGET_GB:-6.0}
      ANVIL_ML_INTERNAL_TOKEN: ${ANVIL_ML_INTERNAL_TOKEN:-anvil-local-ml}
    depends_on:
      init-checkpoint:
        condition: service_completed_successfully
    ports: ["8001:8001"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - local_data:/data
      - checkpoints:/checkpoints:ro
      - adapters:/adapters
      # Reuse the host's Hugging Face cache so SAM3 is not re-downloaded per
      # machine. Override with HF_CACHE_DIR if your cache lives elsewhere.
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/hf-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 30
    command: uvicorn anvil_ml.main:app --host 0.0.0.0 --port 8001

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-anvil}:${POSTGRES_PASSWORD:-anvil}@postgres:5432/${POSTGRES_DB:-anvil}
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      STORAGE_ROOT: /data
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - local_data:/data
    command: arq anvil_worker.main.WorkerSettings

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports: ["5173:5173"]
    command: pnpm dev --host 0.0.0.0

volumes:
  postgres_data:
  minio_data:
  checkpoints:
  adapters:
  local_data:

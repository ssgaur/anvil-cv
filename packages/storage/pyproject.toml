[project]
name = "anvil-storage"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35",
  "azure-storage-blob>=12.23",
  "google-cloud-storage>=2.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anvil_storage"]
